# App Fly.io separado para homologacao/desenvolvimento.
# Deploy: fly deploy -c fly.dev.toml

app = "bjjrats-dev"
primary_region = "gru"

[build]
  [build.args]
    VITE_TURNSTILE_SITE_KEY = "0x4AAAAAADm4HnOK8P1JV2Ss"

[env]
  NODE_ENV = "production"
  APP_ENV  = "development"
  PORT     = "3000"
  UPLOADS_DIR = "/app/uploads"
  FINANCIAL_AUTOMATION_DISABLED = "true"

[http_service]
  internal_port       = 3000
  force_https         = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory   = "512mb"
  cpu_kind = "shared"
  cpus     = 1
  memory_mb = 512

[[mounts]]
  source      = "bjjrats_dev_uploads"
  destination = "/app/uploads"
  initial_size = "1gb"
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "5gb"
  auto_extend_size_limit = "20gb"
