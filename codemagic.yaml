workflows:
  ios-build:
    name: iOS Build & TestFlight
    max_build_duration: 60
    environment:
      node: 20.x
      xcode: 16.4
      groups:
        - apple-signing
      vars:
        BUNDLE_ID: com.bjjrats.app
    scripts:
      - name: Preflight configuration
        script: |
          node scripts/codemagic-preflight.mjs
      - name: Install pnpm
        script: |
          npm install -g pnpm@10.4.1
      - name: Install dependencies
        script: |
          pnpm install --frozen-lockfile
      - name: Build web app
        script: |
          pnpm build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Resolve SPM dependencies
        script: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
      - name: Fetch signing assets
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Apply provisioning profiles to Xcode project
        script: |
          cd ios/App
          xcode-project use-profiles
      - name: Update build number
        script: |
          cd ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo 0)
          UPDATED_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          agvtool new-version -all "$UPDATED_BUILD_NUMBER"
      - name: Build iOS archive
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            clean archive 2>&1 | xcpretty
      - name: Export IPA
        script: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath $CM_BUILD_DIR/output \
            -allowProvisioningUpdates 2>&1 | xcpretty
    artifacts:
      - output/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
